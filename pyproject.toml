[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selenium-lab-02"
version = "1.0.0"
description = "Лабораторная работа №2 по Selenium WebDriver"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "selenium>=4.20",
    "webdriver-manager>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -s"
